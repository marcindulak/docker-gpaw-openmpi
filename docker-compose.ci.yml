services:
  gpaw:
    image: 'gpaw-openmpi:latest'
    volumes:
      - './myjob:/mnt:rw'
    command:
      - /bin/bash
      - -c
      - |
        . /etc/profile.d/gpaw-*.sh
        . /etc/profile.d/modules.sh
        module use /usr/share/modulefiles
        module load mpi/openmpi
        cd /mnt
        export PYTHONPATH=$$MPI_PYTHON3_SITEARCH
        export OMP_NUM_THREADS=1
        export GPAW_MPI_BACKEND=cgpaw
        mpiexec --allow-run-as-root -np 1 gpaw test
        mpiexec --allow-run-as-root -np 1 gpaw python h2.py && grep "Free energy" h2.txt
